name: Build Native Ohotnik APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download & Extract v312 Reference Project
        run: |
          pip install gdown
          if [ ! -f "settings.gradle.kts" ]; then
            gdown --id 1btRpa9RyfonopkwqsytQr4grRAuL5wqV -O base_project.zip
            unzip -q -o base_project.zip
            rm -f base_project.zip
          fi
          gdown --id 1AU0-Fwkm2KV2H8kWZpX0sUIG7OysOCTJ -O v309_pack.zip
          unzip -q -o v309_pack.zip
          rm -f v309_pack.zip
          gdown --id 1ecp0P2UKTZfb3W2Z22rBDtfTQmpkntmn -O v312_master_pack.zip
          unzip -q -o v312_master_pack.zip
          rm -f v312_master_pack.zip
          python3 prebundle_osm_tiles.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for Gradle
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Ohotnik_Rossii_PRO_v312_Reference_Edition_APK
          path: app/build/outputs/apk/debug/app-debug.apk
