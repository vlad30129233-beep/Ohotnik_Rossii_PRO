name: Build Native Ohotnik APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download & Extract v312 Complete Project
        run: |
          pip install -q gdown
          curl -sL "https://drive.google.com/uc?export=download&id=1hC1BlvR0fyh0__CUAM0QGLpU8k-FJvvO&confirm=t" -o p1.zip
          unzip -tq p1.zip || gdown --fuzzy "https://drive.google.com/file/d/1hC1BlvR0fyh0__CUAM0QGLpU8k-FJvvO/view" -O p1.zip
          unzip -q -o p1.zip
          rm -f p1.zip
          curl -sL "https://drive.google.com/uc?export=download&id=1A0Rhs4mLmzUDRL8RFOFMHVFkCgWhfiK-&confirm=t" -o p2.zip
          unzip -tq p2.zip || gdown --fuzzy "https://drive.google.com/file/d/1A0Rhs4mLmzUDRL8RFOFMHVFkCgWhfiK-/view" -O p2.zip
          unzip -q -o p2.zip
          rm -f p2.zip
          curl -sL "https://drive.google.com/uc?export=download&id=11APSiRYAYawoG6LV3BL3AtijdR9EDUR1&confirm=t" -o p3.zip
          unzip -tq p3.zip || gdown --fuzzy "https://drive.google.com/file/d/11APSiRYAYawoG6LV3BL3AtijdR9EDUR1/view" -O p3.zip
          unzip -q -o p3.zip
          rm -f p3.zip
          python3 prebundle_osm_tiles.py || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for Gradle
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Ohotnik_Rossii_PRO_v312_Reference_Edition_APK
          path: app/build/outputs/apk/debug/app-debug.apk
