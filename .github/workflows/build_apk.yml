name: Build Native Ohotnik APK v316 (Zero-Lag 60FPS + In-Place Update)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download & Extract v316 Zero-Lag Native Project & Assets
        run: |
          python3 - << 'PY'
          import urllib.request, http.cookiejar, re, zipfile, os

          def download_gdrive(file_id, out_path):
              cj = http.cookiejar.CookieJar()
              opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
              opener.addheaders = [('User-Agent', 'Mozilla/5.0')]
              url = f"https://drive.google.com/uc?export=download&id={file_id}"
              resp = opener.open(url)
              data = resp.read()
              if data[:4] == b'PK\x03\x04':
                  with open(out_path, 'wb') as f:
                      f.write(data)
                  print(f"Downloaded {out_path} ({len(data)} bytes)")
                  return
              html = data.decode('utf-8', errors='ignore')
              m_uuid = re.search(r'name="uuid"\s+value="([^"]+)"', html)
              m_confirm = re.search(r'name="confirm"\s+value="([^"]+)"', html)
              confirm_val = m_confirm.group(1) if m_confirm else 't'
              dl_url = f"https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm={confirm_val}"
              if m_uuid:
                  dl_url += f"&uuid={m_uuid.group(1)}"
              resp2 = opener.open(dl_url)
              data2 = resp2.read()
              if data2[:4] != b'PK\x03\x04':
                  raise RuntimeError(f"Failed to download {file_id}, header={data2[:64]}")
              with open(out_path, 'wb') as f:
                  f.write(data2)
              print(f"Downloaded {out_path} ({len(data2)} bytes)")

          parts = [
              ("1HzNKYxJRwrg5p7aGED7vluFhoKdbnHwR", "/tmp/part1.zip"),
              ("19injbZDayHjiaikM27O5pG3LQaoXM_Ox", "/tmp/part2.zip"),
              ("1G_cwpF2PaKojdltClDKvnRJGpaXfj-An", "/tmp/part3.zip"),
          ]
          for fid, zpath in parts:
              download_gdrive(fid, zpath)
              with zipfile.ZipFile(zpath, 'r') as zf:
                  zf.extractall(".")
              os.remove(zpath)

          html_p = "app/src/main/assets/www/index.html"
          bundle_p = "app/src/main/assets/www/app_bundle.js"
          splash_p = "app/src/main/assets/www/splash.mp4"
          keystore_p = "app/ohotnik_fixed.keystore"

          assert os.path.exists(html_p), "index.html missing!"
          assert os.path.exists(bundle_p), "app_bundle.js missing!"
          assert os.path.exists(splash_p), "splash.mp4 missing!"
          assert os.path.exists(keystore_p), "ohotnik_fixed.keystore missing!"

          with open(bundle_p, "r", encoding="utf-8") as f:
              b = f.read()
          assert "ensureTabRenderedV316" in b, "v316 Zero-Lag coordinator missing!"
          assert "V315_SURVIVAL_DB" in b and "tlh_25" in b, "v315 survival expansion missing!"
          print(f"Verified v316 Zero-Lag assets: index.html ({os.path.getsize(html_p)} B), app_bundle.js ({os.path.getsize(bundle_p)} B), splash.mp4 ({os.path.getsize(splash_p)} B)")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build In-Place Update APK (v316 Zero-Lag)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Clean Download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Ohotnik_Rossii_PRO_v316_Ultimate_Update.apk
          ls -lh Ohotnik_Rossii_PRO_v316_Ultimate_Update.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ohotnik-Rossii-PRO-v316-ZeroLag-APK
          path: Ohotnik_Rossii_PRO_v316_Ultimate_Update.apk
