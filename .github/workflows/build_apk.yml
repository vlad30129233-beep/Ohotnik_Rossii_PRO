name: Build Native Ohotnik APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and Extract v313 Project
        run: |
          pip install -q gdown || pip install --break-system-packages -q gdown
          curl -sL "https://drive.usercontent.google.com/download?id=1BaYDwfodIPYfaCl1gE08hayaZgRUKJy5&export=download&confirm=t" -o p1.zip
          unzip -tq p1.zip || gdown --fuzzy "https://drive.google.com/file/d/1BaYDwfodIPYfaCl1gE08hayaZgRUKJy5/view" -O p1.zip
          unzip -q -o p1.zip
          rm -f p1.zip
          curl -sL "https://drive.usercontent.google.com/download?id=19injbZDayHjiaikM27O5pG3LQaoXM_Ox&export=download&confirm=t" -o p2.zip
          unzip -tq p2.zip || gdown --fuzzy "https://drive.google.com/file/d/19injbZDayHjiaikM27O5pG3LQaoXM_Ox/view" -O p2.zip
          unzip -q -o p2.zip
          rm -f p2.zip
          curl -sL "https://drive.usercontent.google.com/download?id=1G_cwpF2PaKojdltClDKvnRJGpaXfj-An&export=download&confirm=t" -o p3.zip
          unzip -tq p3.zip || gdown --fuzzy "https://drive.google.com/file/d/1G_cwpF2PaKojdltClDKvnRJGpaXfj-An/view" -O p3.zip
          unzip -q -o p3.zip
          rm -f p3.zip
          python3 prebundle_osm_tiles.py || true

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Ohotnik_Rossii_PRO_v313_Reference_Edition_APK
          path: app/build/outputs/apk/debug/app-debug.apk
