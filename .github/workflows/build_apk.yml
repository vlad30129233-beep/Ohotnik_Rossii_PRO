name: Build Native Ohotnik APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Download & Extract v312 Complete Project
        run: |
          curl -sL "https://drive.usercontent.google.com/download?id=1hC1BlvR0fyh0__CUAM0QGLpU8k-FJvvO&export=download&confirm=t" -o p1.zip
          unzip -q -o p1.zip
          rm -f p1.zip
          curl -sL "https://drive.usercontent.google.com/download?id=1A0Rhs4mLmzUDRL8RFOFMHVFkCgWhfiK-&export=download&confirm=t" -o p2.zip
          unzip -q -o p2.zip
          rm -f p2.zip
          curl -sL "https://drive.usercontent.google.com/download?id=11APSiRYAYawoG6LV3BL3AtijdR9EDUR1&export=download&confirm=t" -o p3.zip
          unzip -q -o p3.zip
          rm -f p3.zip
          python3 prebundle_osm_tiles.py || true

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 6. Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 7. Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Ohotnik_Rossii_PRO_v312_Reference_Edition_APK
          path: app/build/outputs/apk/debug/app-debug.apk
