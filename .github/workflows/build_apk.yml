name: Build Native Ohotnik APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and Extract v312 Project
        run: |
          pip install -q gdown || pip install --break-system-packages -q gdown
          curl -sL "https://drive.usercontent.google.com/download?id=1hC1BlvR0fyh0__CUAM0QGLpU8k-FJvvO&export=download&confirm=t" -o p1.zip
          unzip -tq p1.zip || gdown --fuzzy "https://drive.google.com/file/d/1hC1BlvR0fyh0__CUAM0QGLpU8k-FJvvO/view" -O p1.zip
          unzip -q -o p1.zip
          rm -f p1.zip
          curl -sL "https://drive.usercontent.google.com/download?id=1A0Rhs4mLmzUDRL8RFOFMHVFkCgWhfiK-&export=download&confirm=t" -o p2.zip
          unzip -tq p2.zip || gdown --fuzzy "https://drive.google.com/file/d/1A0Rhs4mLmzUDRL8RFOFMHVFkCgWhfiK-/view" -O p2.zip
          unzip -q -o p2.zip
          rm -f p2.zip
          curl -sL "https://drive.usercontent.google.com/download?id=11APSiRYAYawoG6LV3BL3AtijdR9EDUR1&export=download&confirm=t" -o p3.zip
          unzip -tq p3.zip || gdown --fuzzy "https://drive.google.com/file/d/11APSiRYAYawoG6LV3BL3AtijdR9EDUR1/view" -O p3.zip
          unzip -q -o p3.zip
          rm -f p3.zip
          python3 prebundle_osm_tiles.py || true

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Ohotnik_Rossii_PRO_v312_Reference_Edition_APK
          path: app/build/outputs/apk/debug/app-debug.apk
